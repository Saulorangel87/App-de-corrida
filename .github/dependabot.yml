version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Os tipos acompanham a versão do Node que roda em produção (22 LTS); subir só junto com o runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Produção usa só versão LTS do Node (par); as versões ímpares não têm suporte longo.
      # A troca de LTS (22 para 24) é decidida à mão, junto com @types/node.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
